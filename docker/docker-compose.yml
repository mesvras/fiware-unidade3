name: ${COMPOSE_PROJECT_NAME:-natal}

services:
  mongo:
    image: mongo:${MONGO_VERSION:?defina MONGO_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  orion:
    image: quay.io/fiware/orion-ld:${ORION_LD_VERSION:?defina ORION_LD_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      mongo:
        condition: service_healthy
    command: ["-dbhost", "mongo", "-mongocOnly", "-logLevel", "${ORION_LD_LOG_LEVEL:-WARN}"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1026/ngsi-ld/ex/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  internal:
    internal: true

volumes:
  mongo-data:
  mongo-config:
