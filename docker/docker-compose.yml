name: ${COMPOSE_PROJECT_NAME:-natal}

services:
  mongo:
    image: mongo:${MONGO_VERSION:?defina MONGO_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  orion:
    image: quay.io/fiware/orion-ld:${ORION_LD_VERSION:?defina ORION_LD_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      mongo:
        condition: service_healthy
    env_file: ./orion/orion.env
    environment:
      ORIONLD_LOG_LEVEL: ${ORION_LD_LOG_LEVEL:-WARN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1026/ngsi-ld/ex/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:?defina MOSQUITTO_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  iot-agent:
    image: telefonicaiot/iotagent-json:${IOTA_JSON_VERSION:?defina IOTA_JSON_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      mongo:
        condition: service_healthy
      orion:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      IOTA_CB_HOST: orion
      IOTA_CB_PORT: "1026"
      IOTA_CB_NGSI_VERSION: ld
      IOTA_NORTH_PORT: "4041"
      IOTA_PROVIDER_URL: http://iot-agent:4041
      IOTA_REGISTRY_TYPE: mongodb
      IOTA_MONGO_URI: mongodb://mongo:27017/iotagentjson
      IOTA_MQTT_HOST: mosquitto
      IOTA_MQTT_PORT: "1883"
      IOTA_JSON_LD_CONTEXT: ${IOTA_JSON_LD_CONTEXT:-https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context-v1.8.jsonld}
      IOTA_AMQP_DISABLED: "true"
      IOTA_TIMESTAMP: "true"
      IOTA_AUTOCAST: "true"
      IOTA_LOG_LEVEL: ${IOTA_LOG_LEVEL:-WARN}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4041/iot/about',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  crate:
    image: crate:${CRATE_VERSION:?defina CRATE_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    command: ["crate", "-Cdiscovery.type=single-node", "-Ccluster.name=natal"]
    environment:
      CRATE_HEAP_SIZE: ${CRATE_HEAP_SIZE:-1g}
    volumes:
      - crate-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4200/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  quantumleap:
    image: orchestracities/quantumleap:${QUANTUMLEAP_VERSION:?defina QUANTUMLEAP_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      crate:
        condition: service_healthy
    environment:
      CRATE_HOST: crate
      QL_DEFAULT_DB: crate
      USE_GEOCODING: "False"
      CACHE_QUERIES: "False"
      LOGLEVEL: ${QL_LOG_LEVEL:-WARNING}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8668/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  context:
    image: nginx:${NGINX_VERSION:?defina NGINX_VERSION no .env}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./context/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../pkg:/srv/pkg:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/natal-context.jsonld"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: runtime
    image: natal-api:dev
    restart: unless-stopped
    networks: [internal]
    depends_on:
      orion:
        condition: service_healthy
      context:
        condition: service_healthy
    environment:
      ORION_URL: http://orion:1026
      CONTEXT_URL: http://context/natal-context.jsonld
      NGSILD_TENANT: ${API_TENANT:-}
      AUTH_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  simulator:
    profiles: [sim]
    build:
      context: ..
      dockerfile: simulators/Dockerfile
      target: runtime
    image: natal-simulator:dev
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      SIM_SEED: ${SIM_SEED:-natal}
      SIM_START_DATE: ${SIM_START_DATE:-}
      SIM_CONCURRENCY: ${SIM_CONCURRENCY:-8}
      SIM_INTERVAL: ${SIM_INTERVAL:-30}
      SIM_HOTELS: ${SIM_HOTELS:-12}
      SIM_NIGHTS: ${SIM_NIGHTS:-60}

  sim-tests:
    profiles: [test]
    build:
      context: ..
      dockerfile: simulators/Dockerfile
      target: test
    image: natal-simulator-tests:dev
    network_mode: none

  test-idp:
    profiles: [test]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    image: natal-api-tests:dev
    networks: [internal]
    command: ["python", "-m", "tests.idp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 6

  api-auth:
    profiles: [test]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: runtime
    image: natal-api:dev
    networks: [internal]
    depends_on:
      orion:
        condition: service_healthy
      context:
        condition: service_healthy
      test-idp:
        condition: service_healthy
    environment:
      ORION_URL: http://orion:1026
      CONTEXT_URL: http://context/natal-context.jsonld
      AUTH_ENABLED: "true"
      OIDC_ISSUER: http://test-idp/realms/natal
      OIDC_AUDIENCE: natal-api
      OIDC_JWKS_URL: http://test-idp:8080/jwks.json
      JWKS_MIN_REFRESH_SECONDS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  api-tests:
    profiles: [test]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    image: natal-api-tests:dev
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
      api-auth:
        condition: service_healthy
      test-idp:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      API_AUTH_URL: http://api-auth:8000
      IDP_URL: http://test-idp:8080

networks:
  internal:
    internal: true

volumes:
  mongo-data:
  mongo-config:
  mosquitto-data:
  crate-data:
