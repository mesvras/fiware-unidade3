server {
    listen 80;
    server_name context;
    root /srv/pkg;

    types {
        application/ld+json jsonld;
    }
    default_type application/octet-stream;

    gzip off;
    sub_filter_types application/ld+json;
    sub_filter_once off;
    sub_filter 'https://example.org/natal/natal-context.jsonld' 'http://context/natal-context.jsonld';
    sub_filter 'https://smartdatamodels.org/context.jsonld' 'http://context/ctx/sdm-merged-offline.jsonld';

    location ~ \.jsonld$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
